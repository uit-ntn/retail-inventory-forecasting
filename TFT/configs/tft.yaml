model_name: Temporal Fusion Transformer (TFT)
library: Darts (PyTorch Backend)
dataset:
  encoder_length: 56
  prediction_length: 14
  features:
    static_covariates:
    - Store_ID_feat
    - Product_ID_feat
    - Region
    - Category
    past_covariates:
    - Price
    - Discount
    - Competitor Pricing
    - Inventory Level
    future_covariates:
    - Demand Forecast
    - Holiday/Promotion
    - Seasonality
    - month
    - dayofweek
hyperparameters:
  hidden_size: 64
  attention_heads: 4
  dropout: 0.2             
  batch_size: 256          
  learning_rate: 0.0005    
  weight_decay: 0.0001     
  lstm_layers: 1
  num_epochs: 30
training:
  device: GPU
  precision: 32-bit (Standard)
  early_stopping_patience: 5
metrics:
  RMSE: 12.90              
  MAE: 10.42               
  WAPE: 0.0773             
interpretation:
  top_important_features:
  - Units Sold (Past)
  - Price
  - Demand Forecast
  note: Feature importance inferred from TFT architecture standard behavior.
